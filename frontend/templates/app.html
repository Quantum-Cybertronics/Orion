<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ORION</title>

    <link rel="stylesheet" href="/static/app.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">O</div>

            <div>
                <h1>ORION</h1>
                <p>Private AI assistant</p>
            </div>
        </div>

        <div class="model-picker">
            <label for="model-select">Model</label>

            <select id="model-select" disabled>
                <option>Loading&hellip;</option>
            </select>
        </div>

        <div class="user-area">
            <span>{{ username }}</span>

            <button id="logout-button">
                Logout
            </button>
        </div>
    </header>


    <main class="workspace">

        <aside class="sidebar">

            <button id="new-conversation">
                + New conversation
            </button>

            <div id="conversation-list">
                <!-- Conversations will appear here -->
            </div>

            <div class="sidebar-footer">

                <button
                    id="clear-toggle"
                    class="clear-toggle"
                    type="button"
                    aria-expanded="false"
                >Clear history&hellip;</button>

                <div id="clear-panel" class="clear-panel" hidden>

                    <label class="clear-row">
                        <span>Older than</span>
                        <select id="clear-age">
                            <option value="7">7 days</option>
                            <option value="30" selected>30 days</option>
                            <option value="90">90 days</option>
                        </select>
                    </label>

                    <button id="clear-older" class="danger" type="button">
                        Delete older chats
                    </button>

                    <button id="clear-all" class="danger" type="button">
                        Delete all chats
                    </button>

                    <p id="clear-status" class="clear-status" role="status"></p>

                </div>

            </div>

        </aside>


        <section id="chat" class="chat">

            <div id="ai-banner" class="ai-banner" role="status" hidden></div>

            <div id="messages" class="messages">

                <div class="empty-state">
                    <h2>Welcome to ORION</h2>
                    <p>
                        Start a conversation with your private AI assistant.
                    </p>
                </div>

            </div>


            <div id="file-strip" class="file-strip" hidden></div>

            <form id="message-form" class="message-form">

                <button
                    id="attach-button"
                    class="attach"
                    type="button"
                    title="Attach a file"
                    aria-label="Attach a file"
                >&#128206;</button>

                <input
                    id="file-input"
                    type="file"
                    multiple
                    hidden
                    accept=".txt,.md,.markdown,.rst,.csv,.tsv,.json,.log,.yaml,.yml,.toml,.ini,.cfg,.sql,.py,.js,.ts,.java,.c,.h,.cpp,.hpp,.cs,.go,.rs,.rb,.php,.sh,.bat,.ps1,.pdf,.docx"
                >

                <input
                    id="message-input"
                    type="text"
                    placeholder="Message ORION..."
                    autocomplete="off"
                    required
                >

                <button id="send-button" type="submit">
                    Send
                </button>

            </form>

        </section>

    </main>

</div>

<script src="/static/markdown.js"></script>
<script src="/static/app.js"></script>

</body>
</html>
